name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, for the toolchain-drift job; the pinned jobs run too, which also
    # catches rot in the actions and registries they depend on.
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host crates and rig programmes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - name: Test out-of-workspace rig programme
        run: cargo test --manifest-path tests/external-rig/Cargo.toml -p fixture-rig-program --target x86_64-unknown-linux-gnu

  python:
    name: Host package (helic_daq)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: PYTHONPATH=.:tests python -m unittest discover -s tests -v
      - name: Dry-run external regression profile against mock transport
        run: python -m unittest discover -s ../tests/external-rig -p 'test_*.py' -v

  julia:
    name: Host package (HelicDAQ.jl)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-julia
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: "1.10"
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  matlab:
    name: Host package (helicdaq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: matlab-actions/setup-matlab@a0180c939fb1a28de13f44f7b778b912384ced1f # v3.0.1
        with:
          products: Instrument_Control_Toolbox
      - uses: matlab-actions/run-command@bcd446a219949c24051c1d04a4b4e0274c42f23b # v3.2.0
        with:
          command: cd("host-matlab"); runTests();

  firmware:
    name: Firmware (thumbv8m.main-none-eabihf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          # Keep in step with rust-toolchain.toml.
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: firmware -> target
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the rig verification tools
        # Installed rather than run from a path, exactly as an out-of-tree rig
        # consumes them.
        run: pip install -e ../host-python
      - name: Check crate dependency boundaries
        run: helic-deps-check
      - name: Check out-of-workspace dependency policy
        run: helic-deps-check --workspace ../tests/external-rig --policy ../tests/external-rig/dependency-policy.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --workspace -- -D warnings
      - run: cargo build --release --workspace
      - name: Check host build-script helpers
        # Excluded from the workspace so that `--workspace` does not
        # cross-compile it, so it needs its own host-target checks.
        run: |
          cargo fmt --manifest-path build/Cargo.toml -- --check
          cargo clippy --manifest-path build/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
          cargo test --manifest-path build/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Check real-time symbols are SRAM-resident
        run: helic-rt-layout
      - name: Build out-of-workspace firmware
        working-directory: tests/external-rig
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --workspace -- -D warnings
          cargo build --release --workspace
      - name: Check out-of-workspace real-time symbols
        run: helic-rt-layout --profile ../tests/external-rig/rig-profile.toml --profile ../tests/external-rig/service-rig-profile.toml --elf-dir ../tests/external-rig/target/thumbv8m.main-none-eabihf/release

  toolchain-drift:
    name: Rust gates on latest stable
    # Scheduled or manual only. rust-toolchain.toml pins the release every other
    # job uses; this runs the Rust gates on the newest stable instead, so a new
    # compiler or clippy lint shows up here before an upgrade rather than
    # breaking main, as clippy 1.98 did on 2026-09-01. A failure is advance
    # notice of what the next toolchain upgrade must fix, not a defect in the
    # pinned build. Each check runs even if an earlier one fails, so one run
    # reports everything.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # Takes precedence over rust-toolchain.toml for every cargo invocation.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e host-python
      - name: Report the toolchain under test
        run: |
          rustc --version
          cargo clippy --version
      - name: Host crates
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test
      - name: Firmware workspace
        if: ${{ !cancelled() }}
        working-directory: firmware
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --workspace -- -D warnings
          cargo build --release --workspace
      - name: Host build-script helpers
        if: ${{ !cancelled() }}
        working-directory: firmware
        run: |
          cargo clippy --manifest-path build/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
          cargo test --manifest-path build/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Real-time symbols are SRAM-resident
        # A new compiler can change inlining, which is how tick-path calls into
        # flash appear.
        if: ${{ !cancelled() }}
        working-directory: firmware
        run: helic-rt-layout
      - name: Out-of-workspace firmware and its real-time symbols
        if: ${{ !cancelled() }}
        working-directory: tests/external-rig
        run: |
          cargo clippy --release --workspace -- -D warnings
          cargo build --release --workspace
          helic-rt-layout --profile rig-profile.toml --profile service-rig-profile.toml --elf-dir target/thumbv8m.main-none-eabihf/release
