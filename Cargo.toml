[workspace]
resolver = "2"
members = [
    "helic-broker",
    "helic-core",
    "helic-drivers",
    "helic-proto",
    "helic-rt",
]
# The firmware is its own workspace and defaults to thumbv8m.main-none-eabihf
# (see firmware/.cargo/config.toml). Dependency-light rig-local library targets
# may also be tested explicitly on the host.
exclude = ["firmware"]

[workspace.package]
version = "0.2.4"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
