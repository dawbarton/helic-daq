[package]
name = "helic-rt"
description = "Portable real-time contracts and cross-core state for HELIC-DAQ"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
diag-max-command-burst = []
# Reproduce the rejected 132-value copied command layout for comparative WCET.
diag-wide-command-payload = []
# Firmware enables this for methods reachable from the mandatory core-1 path;
# host tests leave ordinary linker placement in force.
rt-sram = []

[dependencies]
heapless = "0.9.3"
helic-core = { path = "../helic-core" }
helic-proto = { path = "../helic-proto" }
