# Rust toolchain for the whole repository, pinned to an exact release.
#
# A floating `stable` let a new compiler change the gates without any commit
# here: clippy 1.98 added `chunks_exact_to_as_chunks` and failed `-D warnings`
# on `main` from its release on 2026-09-01 until v0.3.1. Upgrade deliberately:
# change the version here and in both `toolchain:` inputs in
# `.github/workflows/ci.yml` together, run the complete check set, and fix what
# the new compiler and clippy report in the same commit.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["thumbv8m.main-none-eabihf"]
