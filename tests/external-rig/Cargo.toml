# Independent workspace for the out-of-workspace composition acceptance test.
[workspace]
resolver = "2"
members = ["fixture-program", "firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
helic-core = "=0.1.0"
helic-rt = "=0.1.0"
helic-fw-rt = { version = "=0.1.0", features = ["rt-sram"] }
cortex-m-rt = "0.7.5"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

# Test unpublished packages through the same versioned consumer declarations.
[patch.crates-io]
helic-core = { path = "../../helic-core" }
helic-drivers = { path = "../../helic-drivers" }
helic-proto = { path = "../../helic-proto" }
helic-rt = { path = "../../helic-rt" }
helic-fw-rt = { path = "../../firmware/rt" }
