# Independent workspace for the out-of-workspace composition acceptance tests.
#
# Two firmware members deliberately sit at opposite ends of the platform.
# `fw-fixture-rig` links no core-0 support at all, proving the real-time
# platform stands alone; `fw-fixture-service-rig` composes the core-0 services
# every production rig uses, proving that half crosses the boundary too. Both
# are built from one lockfile and one set of pins, which is also the point:
# an out-of-tree rig owns its Embassy versions and must keep them in step with
# the platform crates it links against.
[workspace]
resolver = "2"
members = ["fixture-program", "firmware", "service-firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
helic-core = "=0.1.3"
helic-rt = "=0.1.3"
helic-fw-build = "=0.1.3"
helic-fw-rt = { version = "=0.1.3", features = ["rt-sram"] }
helic-fw-support = { version = "=0.1.3", default-features = false }
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = { version = "1.3.0", features = ["disable-blocking-mode"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-net = { version = "0.9.1", features = ["medium-ethernet", "proto-ipv4", "tcp", "udp", "dhcpv4", "defmt"] }
embassy-rp = { version = "0.10.0", features = ["rp235xa", "defmt", "time-driver", "critical-section-impl", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1.1"

# Test unpublished packages through the same versioned consumer declarations.
[patch.crates-io]
helic-core = { path = "../../helic-core" }
helic-drivers = { path = "../../helic-drivers" }
helic-proto = { path = "../../helic-proto" }
helic-rt = { path = "../../helic-rt" }
helic-fw-build = { path = "../../firmware/build" }
helic-fw-rt = { path = "../../firmware/rt" }
helic-fw-support = { path = "../../firmware/support" }
